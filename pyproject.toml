[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrophysics-ai"
version = "0.0.1"
description = "GPU physics-informed neural operators for groundwater, benchmarked against gray-box ODEs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdoul Rachid Ouedraogo" }]
keywords = [
    "scientific-machine-learning", "physics-informed", "neural-operator",
    "groundwater", "hydrology", "pytorch", "physicsnemo", "cuda", "deep-learning",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
# GPU / deep-learning stack. Install on the CUDA machine.
gpu = [
    "torch>=2.0",
    "torchdiffeq>=0.2",
]
# NVIDIA PhysicsNeMo framework port (PhysicsNeMoUDE, run with `--model ude_nemo`).
# physicsnemo requires Python >= 3.11, so it is gated by a marker; this keeps the package
# (and `uv lock`) resolvable on 3.10 for everyone who does not need the optional NeMo port.
nemo = [
    "nvidia-physicsnemo>=2.0; python_version >= '3.11'",
]
# Plotting + spatial maps (optional).
viz = [
    "matplotlib>=3.6",
    "geopandas>=0.12",
]
# Choushui head + subsidence explorer (hydrophysics.explorer / hydrophysics.subsidence).
# Pure runtime deps for the explorer + its tests (parquet engine, geometry, plotting).
# The real-shapefile CLI path additionally uses geopandas (see [viz]).
explorer = [
    "shapely>=2.0",
    "pyarrow>=12",
    "plotly>=5.20",
]
# External data collection: the ET driver (hydrophysics.et) fetches FAO-56 ET0 from
# Open-Meteo via the AquaScope toolkit; pyproj converts the TWD97 well coordinates to
# WGS84. A committed ET0 cache means the headline result reproduces without fetching.
data = [
    "aquascope>=0.5",
    "pyproj>=3.4",
]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.urls]
Repository = "https://github.com/Rekin226/HydroPhysicsAI"

[project.scripts]
hydrophysics-train = "hydrophysics.train:main"
hydrophysics-baselines = "hydrophysics.run_baselines:main"

[tool.setuptools.packages.find]
include = ["hydrophysics*"]

[tool.setuptools.package-data]
hydrophysics = ["sample_data/**/*.csv"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Default error classes (E4/E7/E9, F) plus import sorting (I), bugbear (B), pyupgrade
# (UP), and simplify (SIM) -- the high-value rules that catch real smells (unsafe
# excepts, strict-less zip, stale syntax). E501/line-length is left to the formatter
# (long pre-existing comment/data lines), and RUF unicode rules are off: the labels
# intentionally use scientific characters (sigma, en-dash).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
